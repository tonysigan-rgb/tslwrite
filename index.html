<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tslWrite — Sign In</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2d3a;
  --accent: #e05c5c;
  --text: #e8eaf0;
  --text-muted: #7a7f9a;
  --input-bg: rgba(255,255,255,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.bg-pattern {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(224,92,92,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(99,102,241,.07) 0%, transparent 50%);
}
.card {
  position: relative; z-index: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 36px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}
.logo {
  font-size: 28px; font-weight: 900; letter-spacing: -1px;
  text-align: center; margin-bottom: 8px;
}
.logo span { color: var(--accent); }
.tagline {
  text-align: center; font-size: 13px; color: var(--text-muted);
  margin-bottom: 28px;
}
.tabs {
  display: flex; gap: 0;
  background: rgba(255,255,255,.04);
  border-radius: 8px; padding: 3px;
  margin-bottom: 24px;
}
.tab {
  flex: 1; text-align: center; padding: 8px;
  border-radius: 6px; font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--text-muted); transition: all .15s;
}
.tab.active { background: var(--accent); color: #fff; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted);
  margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 14px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 14px; outline: none; transition: border-color .15s;
  font-family: inherit;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--text-muted); }
.btn-primary {
  width: 100%; padding: 12px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 4px;
  transition: opacity .15s; font-family: inherit;
}
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 18px 0; color: var(--text-muted); font-size: 12px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.btn-google {
  width: 100%; padding: 11px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 10px;
  transition: border-color .15s; font-family: inherit;
}
.btn-google:hover { border-color: #aaa; }
.error-msg {
  margin-top: 14px; padding: 10px 14px;
  background: rgba(224,92,92,.12);
  border: 1px solid rgba(224,92,92,.3);
  border-radius: 8px; color: #f87171;
  font-size: 13px; display: none;
}
.error-msg.show { display: block; }
.success-msg {
  margin-top: 14px; padding: 10px 14px;
  background: rgba(52,211,153,.1);
  border: 1px solid rgba(52,211,153,.3);
  border-radius: 8px; color: #34d399;
  font-size: 13px; display: none;
}
.success-msg.show { display: block; }
.forgot { text-align: right; margin-top: -8px; margin-bottom: 14px; }
.forgot a { font-size: 12px; color: var(--text-muted); text-decoration: none; }
.forgot a:hover { color: var(--text); }
.setup-notice {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(251,191,36,.1);
  border-top: 1px solid rgba(251,191,36,.2);
  padding: 10px 20px; text-align: center;
  font-size: 12px; color: #fbbf24; z-index: 999;
}
.setup-notice a { color: #fbbf24; font-weight: 700; }
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .6s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-pattern"></div>

<div class="card">
  <div class="logo">tsl<span>Write</span></div>
  <div class="tagline">Professional screenplay writing, free.</div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
  </div>

  <!-- Sign In Form -->
  <div id="login-form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="forgot"><a href="#" onclick="handleForgotPassword()">Forgot password?</a></div>
    <button class="btn-primary" id="btn-signin" onclick="handleSignIn()">Sign In</button>
  </div>

  <!-- Register Form -->
  <div id="register-form" style="display:none">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="reg-name" placeholder="Your name" autocomplete="name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="Min. 6 characters" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="btn-register" onclick="handleRegister()">Create Account</button>
  </div>

  <div class="divider">or</div>

  <button class="btn-google" onclick="handleGoogleSignIn()">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <div class="error-msg" id="error-msg"></div>
  <div class="success-msg" id="success-msg"></div>
</div>

<!-- Firebase notice if config not set -->
<div class="setup-notice" id="setup-notice" style="display:none">
  ⚠️ Firebase not configured yet — <a href="#" onclick="showSetupHelp()">see setup instructions</a>
</div>

<!-- ══ FIREBASE SDK ══ -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ══════════════════════════════════════════════════════
//  ⚠️  REPLACE THIS WITH YOUR FIREBASE PROJECT CONFIG
//  Go to: https://console.firebase.google.com
//  → Your project → Project Settings → Your apps → Config
// ══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyAQKZ7_ocuATRPWf6ljC8U4K0rCQKo3Um0",
  authDomain:        "tslwrite.firebaseapp.com",
  projectId:         "tslwrite",
  storageBucket:     "tslwrite.firebasestorage.app",
  messagingSenderId: "395801581699",
  appId:             "1:395801581699:web:ef82500d81fe379cffa3b6"
};
// ══════════════════════════════════════════════════════

let auth;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();

  // If already signed in, go straight to the app
  auth.onAuthStateChanged(user => {
    if (user) goToApp();
  });

  if (firebaseConfig.apiKey === 'YOUR_API_KEY') {
    document.getElementById('setup-notice').style.display = 'block';
  }
} catch(e) {
  document.getElementById('setup-notice').style.display = 'block';
}

function goToApp() {
  window.location.href = 'scriptwriter.html';
}

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  clearMessages();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('success-msg').classList.remove('show');
}

if (new URLSearchParams(window.location.search).get('reason') === 'signin-required') {
  showError('Please sign in or create an account to access the scriptwriter.');
  window.history.replaceState({}, document.title, window.location.pathname);
}

function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('error-msg').classList.remove('show');
}
function clearMessages() {
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('success-msg').classList.remove('show');
}
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="spinner"></span> Please wait…'
    : btn.dataset.label;
}

// Save original button labels
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-signin').dataset.label = 'Sign In';
  document.getElementById('btn-register').dataset.label = 'Create Account';
});

async function handleSignIn() {
  clearMessages();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showError('Please enter your email and password.'); return; }
  setLoading('btn-signin', true);
  try {
    await auth.signInWithEmailAndPassword(email, password);
    goToApp();
  } catch(e) {
    setLoading('btn-signin', false);
    showError(friendlyError(e.code));
  }
}

async function handleRegister() {
  clearMessages();
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!email || !password) { showError('Please fill in all fields.'); return; }
  if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
  setLoading('btn-register', true);
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    if (name) await cred.user.updateProfile({displayName: name});
    goToApp();
  } catch(e) {
    setLoading('btn-register', false);
    showError(friendlyError(e.code));
  }
}

async function handleGoogleSignIn() {
  clearMessages();
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    goToApp();
  } catch(e) {
    showError(friendlyError(e.code));
  }
}

async function handleForgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showError('Enter your email above first.'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    showSuccess('Password reset email sent — check your inbox.');
  } catch(e) {
    showError(friendlyError(e.code));
  }
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found':      'No account found with this email.',
    'auth/wrong-password':      'Incorrect password. Try again.',
    'auth/email-already-in-use':'This email is already registered.',
    'auth/invalid-email':       'Please enter a valid email address.',
    'auth/weak-password':       'Password must be at least 6 characters.',
    'auth/too-many-requests':   'Too many attempts. Please try again later.',
    'auth/popup-closed-by-user':'Sign-in popup was closed.',
    'auth/network-request-failed': 'Network error. Check your connection.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

function showSetupHelp() {
  alert(
    'Firebase Setup Instructions:\n\n' +
    '1. Go to https://console.firebase.google.com\n' +
    '2. Click "Add project" and name it\n' +
    '3. In the project, go to Authentication → Sign-in method\n' +
    '   → Enable "Email/Password" and "Google"\n' +
    '4. Go to Firestore Database → Create database (start in test mode)\n' +
    '5. Go to Project Settings (gear icon) → Your apps → "</> Web"\n' +
    '6. Register your app and copy the firebaseConfig object\n' +
    '7. Paste it into BOTH index.html and scriptwriter.html\n' +
    '   (look for "YOUR_API_KEY" in both files)\n\n' +
    'Need help? The config looks like:\n' +
    'apiKey: "AIzaSy..."\n' +
    'projectId: "my-app-12345"\n' +
    '...'
  );
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('login-form').style.display !== 'none';
  if (loginVisible) handleSignIn();
  else handleRegister();
});
</script>
</body>
</html>
